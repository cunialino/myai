apiVersion: apps/v1
kind: Deployment
metadata:
  name: llamacpp-graphiti
  namespace: llms
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: llamacpp-graphiti
  template:
    metadata:
      labels:
        app: llamacpp-graphiti
    spec:
      nodeSelector:
        kubernetes.io/hostname: elcungem
      containers:
        - name: llamacpp-graphiti
          image: custom.io/llama-server-radv:latest
          securityContext:
            privileged: true
          command:
            - llama-server
          args:
            - --model
            - /second_part/models/gpt-oss-20b-MXFP4.gguf
            - --alias
            - gpt-oss-20b
            - --jinja
            # gpt-oss has no thinking off-switch -- its chat template only reads
            # `reasoning_effort`, so `--reasoning off` was a silent no-op and the
            # model kept emitting a full thinking channel. `--reasoning-effort low`
            # is the only real lever: measured on a graphiti-sized prompt,
            # completion 1565 -> 588 tokens, thinking 3250 -> 16 chars.
            - --reasoning-effort
            - low
            - -ngl
            - "999"
            - --host
            - 0.0.0.0
            - --port
            - "8082"
            # 8192 left only 4096 prompt tokens after reserving max_tokens=4096,
            # which graphiti's extract_nodes template + a large episode overflows.
            # KV cache is ~72KB/token here, so 16384 costs ~0.6GB.
            - --ctx-size
            - "16384"
            - --parallel
            - "1"
            - -t
            - "16"
            - --metrics
          ports:
            - containerPort: 8082
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          resources:
            requests:
              memory: "4Gi"
              cpu: "100m"
            limits:
              memory: "24Gi"
              cpu: "8"
          volumeMounts:
            - name: models-storage
              mountPath: /second_part/models
            - name: dri-device
              mountPath: /dev/dri
      volumes:
        - name: dri-device
          hostPath:
            path: /dev/dri
        - name: models-storage
          persistentVolumeClaim:
            claimName: models-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: llamacpp-graphiti-svc
  namespace: llms
spec:
  type: ClusterIP
  selector:
    app: llamacpp-graphiti
  ports:
    - protocol: TCP
      port: 8082
      targetPort: 8082