# Non-scalar Open WebUI settings that have no first-class helm value.
# Consumed by values.yaml via extraEnvVars -> configMapKeyRef.
#
# NOTE: OPENAI_API_CONFIGS is keyed by the *index* into openaiBaseApiUrls.
# Reordering that list silently re-points these configs at the wrong endpoint.
apiVersion: v1
kind: ConfigMap
metadata:
  name: openwebui-env
  namespace: openwebui
data:
  # 0 -> http://192.168.0.6:11434/v1  (Strix Halo, llama-swap: everything lives here)
  #
  # connection_type is functional, not cosmetic: utils/task.py picks
  # task.model.default for "local" models and task.model.external otherwise, and
  # the model selector groups/filters on it. TASK_MODEL / TASK_MODEL_EXTERNAL are
  # both unset here so the task path is inert today; "local" is the honest label
  # for a LAN llama-swap box and keeps its models grouped under "Local".
  #
  # model_ids stays empty on purpose: a non-empty list makes Open WebUI skip the
  # endpoint's /models and serve the static list instead, which would freeze the
  # llama-swap aliases. Drop unwanted models in llama-swap, not here.
  OPENAI_API_CONFIGS: >-
    {"0":{"enable":true,"connection_type":"local","auth_type":"none","tags":[],
    "model_ids":[],"prefix_id":"","passthrough_params":[]}}

  # MCP tool servers. Registered at startup by set_tool_servers() (main.py:422),
  # so no admin API call is needed to make these live.
  #
  # info.id is load-bearing: it prefixes every exposed tool name
  # (f"{server_id}_{function_name}", utils/tools.py:471) and falls back to the
  # list index when absent. Keep the ids stable and append-only.
  TOOL_SERVER_CONNECTIONS: >-
    [{"url":"http://graphiti-mcp.graphiti.svc.cluster.local:8000/mcp/",
    "path":"openapi.json","type":"mcp","auth_type":"none","key":"","headers":null,
    "spec_type":"url",
    "info":{"id":"graphiti","name":"graphiti","description":"Temporal knowledge graph memory"},
    "config":{"enable":true,
    "access_grants":[{"permission":"read","principal_id":"*","principal_type":"user"}],
    "function_name_filter_list":""}},
    {"url":"http://ddg-search.ddg-search.svc.cluster.local/mcp",
    "path":"openapi.json","type":"mcp","auth_type":"none","key":"","headers":null,
    "spec_type":"url",
    "info":{"id":"ddg","name":"ddg","description":"DuckDuckGo search"},
    "config":{"enable":true,
    "access_grants":[{"permission":"read","principal_id":"*","principal_type":"user"}],
    "function_name_filter_list":""}}]

  # --- Image GENERATION graph (Qwen-Image-2.1 + viggle-turbo) ---
  # Model chain: UNETLoader(1) -> LoraLoaderModelOnly(2, qwen_21_lr @ 0.8) ->
  # ViggleTurboLora(3, the turbo adapter at strength 1.0). Node 3 is the pack's own
  # loader rather than the stock one on purpose: it applies the LoRA at runtime as a
  # side branch (y = Wx + BAx), while LoraLoaderModelOnly merges it into the weights,
  # which loses part of this adapter's update on bf16 and requantizes with noise on
  # int8. Keep its strength at 1.0.
  #
  # Sampling is SamplerCustom(8) + KSamplerSelect(11, er_sde) + ViggleTurboSigmas(12),
  # i.e. no KSampler and therefore no steps/scheduler/denoise widget: the step count is
  # node 12's sigma string ("1.0, 0.9375, 0.875, 0.75, 0.5, 0.25" = 6 steps; the node
  # appends the terminating 0 itself). Its "latent" input is load-bearing — the node
  # derives the pipeline's resolution-dependent shift from the token count of that
  # latent, so it must be exactly the latent that feeds the sampler (node 7), and it
  # then tracks Open WebUI's width/height writes for free.
  #
  # cfg 4 / er_sde / add_noise=true are the values of the tuned local export
  # (qwen_21_t2i_turbo.json). Upstream's own workflow pairs the sigmas node with euler
  # + BasicGuider at cfg 1 and no negative prompt, so node 8 is the knob to revisit
  # first if turbo output looks soft or over-cooked.
  #
  # ViggleTurboLora and ViggleTurboSigmas are custom nodes (Viggle's comfyui/
  # viggle_turbo.py dropped into ComfyUI/custom_nodes/ on elcunhalo, and the LoRA file
  # into its loras/ dir). Without them /prompt rejects the graph outright — both image
  # paths fail, not just the turbo part.
  COMFYUI_WORKFLOW: |
    {
      "1": {
        "inputs": {
          "unet_name": "qwen_image_2.1_int8_convrot.safetensors",
          "weight_dtype": "default"
        },
        "class_type": "UNETLoader",
        "_meta": {
          "title": "Load Diffusion Model"
        }
      },
      "2": {
        "inputs": {
          "lora_name": "qwen_21_lr.safetensors",
          "strength_model": 0.8,
          "model": [
            "1",
            0
          ]
        },
        "class_type": "LoraLoaderModelOnly",
        "_meta": {
          "title": "lr"
        }
      },
      "4": {
        "inputs": {
          "clip_name": "qwen3vl_8b_int8_convrot.safetensors",
          "type": "qwen_image",
          "device": "default"
        },
        "class_type": "CLIPLoader",
        "_meta": {
          "title": "Text Encoder"
        }
      },
      "5": {
        "inputs": {
          "vae_name": "qwen_image_2.1_vae_bf16.safetensors"
        },
        "class_type": "VAELoader",
        "_meta": {
          "title": "Load VAE"
        }
      },
      "6": {
        "inputs": {
          "prompt": "Cinematic landscape photograph of a vast mountain valley at golden hour.\nSubject: towering snow-capped peaks behind layered blue atmospheric haze, glacial snowmelt feeding a winding crystal-clear river that snakes through terraced green meadows dotted with wildflowers.\nForeground: dense layered forest of pines, firs and autumn-coloured deciduous trees on the rolling hillsides, thin mist drifting between the trunks, a weathered wooden fence post and a moss-covered boulder for scale.\nFraming: wide-angle composition from a low camera position, tack-sharp foreground detail, the river as a leading line through the middle ground, ridge lines on the upper third, natural depth of field.\nPhoto Style: a crisp, high-resolution iPhone 15 Pro Max photo on the 48MP main sensor, hyper-realistic film grain, precise edge definition, immaculate uncompressed digital clarity.\nLighting: bright airy daylight raking across the valley from one side, soft fill that lifts every shadow into a gentle haze, faint warmth catching the ridge lines and the mist for a weightless glow.\nSky: high cirrus streaks over a clear gradient blue, a bank of soft cumulus building around the highest summit.",
          "negative_prompt": "extra legs, extra limbs, merged limbs, missing legs, malformed thighs, fused legs, extra arms",
          "resolution": 1024,
          "clip": [
            "4",
            0
          ],
          "vae": [
            "5",
            0
          ]
        },
        "class_type": "TextEncodeQwenImage21",
        "_meta": {
          "title": "Text Encode Qwen Image 2.1"
        }
      },
      "7": {
        "inputs": {
          "width": 1024,
          "height": 1024,
          "batch_size": 1
        },
        "class_type": "EmptyLatentImage",
        "_meta": {
          "title": "Empty Latent Image"
        }
      },
      "8": {
        "inputs": {
          "add_noise": true,
          "noise_seed": 99138336420017,
          "cfg": 4,
          "model": [
            "3",
            0
          ],
          "positive": [
            "6",
            0
          ],
          "negative": [
            "6",
            1
          ],
          "sampler": [
            "11",
            0
          ],
          "sigmas": [
            "12",
            0
          ],
          "latent_image": [
            "7",
            0
          ]
        },
        "class_type": "SamplerCustom",
        "_meta": {
          "title": "sampler"
        }
      },
      "9": {
        "inputs": {
          "samples": [
            "8",
            0
          ],
          "vae": [
            "5",
            0
          ]
        },
        "class_type": "VAEDecode",
        "_meta": {
          "title": "VAE Decode"
        }
      },
      "10": {
        "inputs": {
          "filename_prefix": "Qwen2.1/t2i",
          "images": [
            "9",
            0
          ]
        },
        "class_type": "SaveImage",
        "_meta": {
          "title": "Save Image"
        }
      },
      "3": {
        "inputs": {
          "lora_name": "Qwen-Image-2.1-viggle-turbo-v0.2.1-6step-lora-r128.safetensors",
          "strength": 1,
          "model": [
            "2",
            0
          ]
        },
        "class_type": "ViggleTurboLora",
        "_meta": {
          "title": "viggle turbo"
        }
      },
      "11": {
        "inputs": {
          "sampler_name": "er_sde"
        },
        "class_type": "KSamplerSelect",
        "_meta": {
          "title": "sampler select"
        }
      },
      "12": {
        "inputs": {
          "latent": [
            "7",
            0
          ],
          "nodes": "1.0, 0.9375, 0.875, 0.75, 0.5, 0.25"
        },
        "class_type": "ViggleTurboSigmas",
        "_meta": {
          "title": "viggle turbo sigmas"
        }
      }
    }


  # Generation mapping. "model" is why IMAGE_GENERATION_MODEL is mandatory: it lands in
  # UNETLoader.unet_name, and get_image_model() returns "" when that env var is empty,
  # which blanks the node. It is also what GET /images/models reads back (first "model"
  # node -> its class_type -> the first *_name entry in /object_info), so the UI
  # dropdown lists the files that are really in ComfyUI's diffusers dir.
  #
  # Every mapped field is written unconditionally, so the payload must always supply it:
  # IMAGE_SIZE and CreateImageForm.n=1 keep width/height/n honest. "seed" names
  # SamplerCustom's widget (noise_seed) for the same reason: _apply_workflow_nodes writes
  # workflow[id]['inputs'][key] verbatim, and when the payload carries no seed — the
  # builtin generate_image tool never does — it substitutes random.randint(0, 2**50), so
  # the value baked into node 8 is a placeholder.
  #
  # The "steps" entry went away with the KSampler: SamplerCustom has no steps widget (the
  # count is node 12's sigma string), so mapping it would inject a key the node ignores
  # and leave IMAGE_STEPS lying in the Admin UI. Reverting the turbo means restoring the
  # KSampler node, the {"type":"steps","node_ids":["8"],"key":"steps"} entry and
  # IMAGE_STEPS together — comfyui.py writes every mapped key even when its payload value
  # is None, and ComfyUI's validator then does int(None) -> TypeError -> refused prompt.
  #
  # negative_prompt is deliberately NOT mapped. The builtin generate_image tool posts
  # CreateImageForm(prompt=...) only, and ComfyUI stringifies a None on a STRING input
  # into the literal word "None": not an error, just a silent negative that overwrites
  # the anatomy list baked into node 6. Re-add
  # {"type":"negative_prompt","node_ids":["6"],"key":"negative_prompt"} if every caller
  # really sends one (the chat UI does, tool calls do not).

  COMFYUI_WORKFLOW_NODES: |
    [
      {
        "type": "model",
        "node_ids": [
          "1"
        ],
        "key": "unet_name"
      },
      {
        "type": "prompt",
        "node_ids": [
          "6"
        ],
        "key": "prompt"
      },
      {
        "type": "width",
        "node_ids": [
          "7"
        ],
        "key": "width"
      },
      {
        "type": "height",
        "node_ids": [
          "7"
        ],
        "key": "height"
      },
      {
        "type": "n",
        "node_ids": [
          "7"
        ],
        "key": "batch_size"
      },
      {
        "type": "seed",
        "node_ids": [
          "8"
        ],
        "key": "noise_seed"
      }
    ]


  # --- Image EDIT graph (its own switch: IMAGE_EDIT_ENGINE=comfyui) ---
  # Node 15 LoadImage is the only Open WebUI-relevant difference from the generation
  # graph: image_edits() uploads every attachment to ComfyUI's /upload/image and writes
  # the returned filename into it. EmptyLatentImage (node 7) fixes the output size, so
  # the reference's aspect ratio is NOT preserved — 1024x1024 unless node 7 changes or
  # IMAGE_EDIT_SIZE is set, in which case width/height must be mapped below too.
  #
  # The turbo half (nodes 3, 11, 12 and the SamplerCustom in 8) is identical to the
  # generation graph and to qwen_21_i2i_turbo.json: edits get the same 6-step er_sde
  # schedule, and the turbo LoRA is just one extra node after qwen_21_lr (2), so nothing
  # else in the edit chain moved. <image1> in the prompt is node 15's image.

  IMAGES_EDIT_COMFYUI_WORKFLOW: |
    {
      "1": {
        "inputs": {
          "unet_name": "qwen_image_2.1_int8_convrot.safetensors",
          "weight_dtype": "default"
        },
        "class_type": "UNETLoader",
        "_meta": {
          "title": "Load Diffusion Model"
        }
      },
      "2": {
        "inputs": {
          "lora_name": "qwen_21_lr.safetensors",
          "strength_model": 0.8,
          "model": [
            "1",
            0
          ]
        },
        "class_type": "LoraLoaderModelOnly",
        "_meta": {
          "title": "lr"
        }
      },
      "4": {
        "inputs": {
          "clip_name": "qwen3vl_8b_int8_convrot.safetensors",
          "type": "qwen_image",
          "device": "default"
        },
        "class_type": "CLIPLoader",
        "_meta": {
          "title": "Text Encoder"
        }
      },
      "5": {
        "inputs": {
          "vae_name": "qwen_image_2.1_vae_bf16.safetensors"
        },
        "class_type": "VAELoader",
        "_meta": {
          "title": "Load VAE"
        }
      },
      "6": {
        "inputs": {
          "prompt": "Re-photograph the landscape from <image1> at golden hour: keep its composition, camera position and geography, but move the sun low so it rakes across the ridge lines and throws long shadows across the valley floor.\nAdd thin mist pooling in the hollows and warm rim light on the treetops, wildflowers scattered through the foreground meadow, and a band of high cirrus clouds above the peaks.\nStyle: crisp high-resolution landscape photograph, hyper-realistic, natural colour, precise edge definition, subtle film grain.",
          "negative_prompt": "low quality, blurry, watermark, text, signature, extra limbs, deformed hands, plastic skin, oversaturated, airbrushed",
          "resolution": 1024,
          "clip": [
            "4",
            0
          ],
          "images.image_1": [
            "15",
            0
          ],
          "vae": [
            "5",
            0
          ]
        },
        "class_type": "TextEncodeQwenImage21",
        "_meta": {
          "title": "Text Encode Qwen Image 2.1"
        }
      },
      "7": {
        "inputs": {
          "width": 1024,
          "height": 1024,
          "batch_size": 1
        },
        "class_type": "EmptyLatentImage",
        "_meta": {
          "title": "Empty Latent Image"
        }
      },
      "8": {
        "inputs": {
          "add_noise": true,
          "noise_seed": 889157198927355,
          "cfg": 4,
          "model": [
            "3",
            0
          ],
          "positive": [
            "6",
            0
          ],
          "negative": [
            "6",
            1
          ],
          "sampler": [
            "11",
            0
          ],
          "sigmas": [
            "12",
            0
          ],
          "latent_image": [
            "7",
            0
          ]
        },
        "class_type": "SamplerCustom",
        "_meta": {
          "title": "sampler"
        }
      },
      "9": {
        "inputs": {
          "samples": [
            "8",
            0
          ],
          "vae": [
            "5",
            0
          ]
        },
        "class_type": "VAEDecode",
        "_meta": {
          "title": "VAE Decode"
        }
      },
      "10": {
        "inputs": {
          "filename_prefix": "Qwen2.1/edit",
          "images": [
            "9",
            0
          ]
        },
        "class_type": "SaveImage",
        "_meta": {
          "title": "Save Image"
        }
      },
      "15": {
        "inputs": {
          "image": "pasted/image (4).png"
        },
        "class_type": "LoadImage",
        "_meta": {
          "title": "Load Image"
        }
      },
      "3": {
        "inputs": {
          "lora_name": "Qwen-Image-2.1-viggle-turbo-v0.2.1-6step-lora-r128.safetensors",
          "strength": 1,
          "model": [
            "2",
            0
          ]
        },
        "class_type": "ViggleTurboLora",
        "_meta": {
          "title": "viggle turbo"
        }
      },
      "11": {
        "inputs": {
          "sampler_name": "er_sde"
        },
        "class_type": "KSamplerSelect",
        "_meta": {
          "title": "sampler select"
        }
      },
      "12": {
        "inputs": {
          "latent": [
            "7",
            0
          ],
          "nodes": "1.0, 0.9375, 0.875, 0.75, 0.5, 0.25"
        },
        "class_type": "ViggleTurboSigmas",
        "_meta": {
          "title": "viggle turbo sigmas"
        }
      }
    }


  # Edit mapping. The type set is smaller than the generation one on purpose:
  # ComfyUIEditImageForm carries {image, prompt, width?, height?, n?, steps?, seed?},
  # and image_edits() fills width/height only when a size is configured and n only when
  # the caller passes one — mapping "width", "height", "n" or "steps" here would write
  # null into INT widgets and fail /prompt validation. "negative_prompt" is worse: the
  # form has no such field, so _apply_workflow_nodes raises AttributeError inside
  # comfyui_edit_image, which catches it and returns None -> "failed to edit image".
  # Keep the edit negative baked into node 6.
  #
  # "image" consumes one uploaded name per listed node_id, so multi-reference edits mean
  # one LoadImage node per image with their ids in order, plus the matching
  # images.image_2, images.image_3, ... slots on node 6 — a graph change, not a mapping
  # change.
  #
  # IMAGE_EDIT_MODEL is used only when the caller omits "model" (the builtin edit_image
  # tool does); a chat model passing its own model string would have it injected into
  # unet_name verbatim.
  #
  # "seed" targets noise_seed (SamplerCustom). ComfyUIEditImageForm has no seed field in
  # image_edits()' payload, so _apply_workflow_nodes always takes its random branch — every
  # edit gets a fresh seed, and there is no way to pin one without adding a seed to that
  # payload. Steps are not mappable at all now: the count lives in node 12's sigma string.

  IMAGES_EDIT_COMFYUI_WORKFLOW_NODES: |
    [
      {
        "type": "model",
        "node_ids": [
          "1"
        ],
        "key": "unet_name"
      },
      {
        "type": "prompt",
        "node_ids": [
          "6"
        ],
        "key": "prompt"
      },
      {
        "type": "image",
        "node_ids": [
          "15"
        ],
        "key": "image"
      },
      {
        "type": "seed",
        "node_ids": [
          "8"
        ],
        "key": "noise_seed"
      }
    ]
