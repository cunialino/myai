apiVersion: v1
kind: ConfigMap
metadata:
  name: openwebui-env
  namespace: openwebui
data:
  OPENAI_API_CONFIGS: >-
    {"0":{"enable":true,"connection_type":"local","auth_type":"none","tags":[],
    "model_ids":[],"prefix_id":"","passthrough_params":[]}}

  TOOL_SERVER_CONNECTIONS: >-
    [{"url":"http://graphiti-mcp.graphiti.svc.cluster.local:8000/mcp/",
    "path":"openapi.json","type":"mcp","auth_type":"none","key":"","headers":null,
    "spec_type":"url",
    "info":{"id":"graphiti","name":"graphiti","description":"Temporal knowledge graph memory"},
    "config":{"enable":true,
    "access_grants":[{"permission":"read","principal_id":"*","principal_type":"user"}],
    "function_name_filter_list":""}},
    {"url":"http://ddg-search.ddg-search.svc.cluster.local/mcp",
    "path":"openapi.json","type":"mcp","auth_type":"none","key":"","headers":null,
    "spec_type":"url",
    "info":{"id":"ddg","name":"ddg","description":"DuckDuckGo search"},
    "config":{"enable":true,
    "access_grants":[{"permission":"read","principal_id":"*","principal_type":"user"}],
    "function_name_filter_list":""}}]

  COMFYUI_WORKFLOW: |
    {
      "1": {
        "inputs": {
          "unet_name": "qwen_image_2.1_turbo_int8_convrot.safetensors",
          "weight_dtype": "default"
        },
        "class_type": "UNETLoader",
        "_meta": {
          "title": "Load Diffusion Model"
        }
      },
      "2": {
        "inputs": {
          "lora_name": "qwen_21_lr.safetensors",
          "strength_model": 1.0,
          "model": [
            "1",
            0
          ]
        },
        "class_type": "LoraLoaderModelOnly",
        "_meta": {
          "title": "lr"
        }
      },
      "4": {
        "inputs": {
          "clip_name": "qwen3vl_8b_int8_convrot.safetensors",
          "type": "qwen_image",
          "device": "default"
        },
        "class_type": "CLIPLoader",
        "_meta": {
          "title": "Text Encoder"
        }
      },
      "5": {
        "inputs": {
          "vae_name": "qwen_image_2.1_vae_bf16.safetensors"
        },
        "class_type": "VAELoader",
        "_meta": {
          "title": "Load VAE"
        }
      },
      "6": {
        "inputs": {
          "prompt": "Cinematic landscape photograph of a vast mountain valley at golden hour.\nSubject: towering snow-capped peaks behind layered blue atmospheric haze, glacial snowmelt feeding a winding crystal-clear river that snakes through terraced green meadows dotted with wildflowers.\nForeground: dense layered forest of pines, firs and autumn-coloured deciduous trees on the rolling hillsides, thin mist drifting between the trunks, a weathered wooden fence post and a moss-covered boulder for scale.\nFraming: wide-angle composition from a low camera position, tack-sharp foreground detail, the river as a leading line through the middle ground, ridge lines on the upper third, natural depth of field.\nPhoto Style: a crisp, high-resolution iPhone 15 Pro Max photo on the 48MP main sensor, hyper-realistic film grain, precise edge definition, immaculate uncompressed digital clarity.\nLighting: bright airy daylight raking across the valley from one side, soft fill that lifts every shadow into a gentle haze, faint warmth catching the ridge lines and the mist for a weightless glow.\nSky: high cirrus streaks over a clear gradient blue, a bank of soft cumulus building around the highest summit.",
          "negative_prompt": "extra legs, extra limbs, merged limbs, missing legs, malformed thighs, fused legs, extra arms",
          "resolution": 1024,
          "clip": [
            "4",
            0
          ],
          "vae": [
            "5",
            0
          ]
        },
        "class_type": "TextEncodeQwenImage21",
        "_meta": {
          "title": "Text Encode Qwen Image 2.1"
        }
      },
      "7": {
        "inputs": {
          "width": 1024,
          "height": 1024,
          "batch_size": 1
        },
        "class_type": "EmptyLatentImage",
        "_meta": {
          "title": "Empty Latent Image"
        }
      },
      "8": {
        "inputs": {
          "add_noise": true,
          "noise_seed": 7777,
          "cfg": 3.0,
          "model": [
            "2",
            0
          ],
          "positive": [
            "6",
            0
          ],
          "negative": [
            "6",
            1
          ],
          "sampler": [
            "11",
            0
          ],
          "sigmas": [
            "12",
            0
          ],
          "latent_image": [
            "7",
            0
          ]
        },
        "class_type": "SamplerCustom",
        "_meta": {
          "title": "sampler"
        }
      },
      "9": {
        "inputs": {
          "samples": [
            "8",
            0
          ],
          "vae": [
            "5",
            0
          ]
        },
        "class_type": "VAEDecode",
        "_meta": {
          "title": "VAE Decode"
        }
      },
      "10": {
        "inputs": {
          "filename_prefix": "Qwen2.1/t2i",
          "images": [
            "9",
            0
          ]
        },
        "class_type": "SaveImage",
        "_meta": {
          "title": "Save Image"
        }
      },
      "11": {
        "inputs": {
          "sampler_name": "res_2s"
        },
        "class_type": "KSamplerSelect",
        "_meta": {
          "title": "sampler select"
        }
      },
      "12": {
        "inputs": {
          "model": [
            "2",
            0
          ],
          "scheduler": "beta57",
          "steps": 8,
          "denoise": 1.0
        },
        "class_type": "BasicScheduler",
        "_meta": {
          "title": "scheduler"
        }
      }
    }

  COMFYUI_WORKFLOW_NODES: |
    [
      {
        "type": "model",
        "node_ids": [
          "1"
        ],
        "key": "unet_name"
      },
      {
        "type": "prompt",
        "node_ids": [
          "6"
        ],
        "key": "prompt"
      },
      {
        "type": "width",
        "node_ids": [
          "7"
        ],
        "key": "width"
      },
      {
        "type": "height",
        "node_ids": [
          "7"
        ],
        "key": "height"
      },
      {
        "type": "n",
        "node_ids": [
          "7"
        ],
        "key": "batch_size"
      },
      {
        "type": "steps",
        "node_ids": [
          "12"
        ],
        "key": "steps"
      },
      {
        "type": "seed",
        "node_ids": [
          "8"
        ],
        "key": "noise_seed"
      }
    ]

  IMAGES_EDIT_COMFYUI_WORKFLOW: |
    {
      "1": {
        "inputs": {
          "unet_name": "qwen_image_2.1_turbo_int8_convrot.safetensors",
          "weight_dtype": "default"
        },
        "class_type": "UNETLoader",
        "_meta": {
          "title": "Load Diffusion Model"
        }
      },
      "2": {
        "inputs": {
          "lora_name": "qwen_21_lr.safetensors",
          "strength_model": 1.0,
          "model": [
            "1",
            0
          ]
        },
        "class_type": "LoraLoaderModelOnly",
        "_meta": {
          "title": "lr"
        }
      },
      "4": {
        "inputs": {
          "clip_name": "qwen3vl_8b_int8_convrot.safetensors",
          "type": "qwen_image",
          "device": "default"
        },
        "class_type": "CLIPLoader",
        "_meta": {
          "title": "Text Encoder"
        }
      },
      "5": {
        "inputs": {
          "vae_name": "qwen_image_2.1_vae_bf16.safetensors"
        },
        "class_type": "VAELoader",
        "_meta": {
          "title": "Load VAE"
        }
      },
      "6": {
        "inputs": {
          "prompt": "Re-photograph the landscape from <image1> at golden hour: keep its composition, camera position and geography, but move the sun low so it rakes across the ridge lines and throws long shadows across the valley floor.\nAdd thin mist pooling in the hollows and warm rim light on the treetops, wildflowers scattered through the foreground meadow, and a band of high cirrus clouds above the peaks.\nStyle: crisp high-resolution landscape photograph, hyper-realistic, natural colour, precise edge definition, subtle film grain.",
          "negative_prompt": "low quality, blurry, watermark, text, signature, extra limbs, deformed hands, plastic skin, oversaturated, airbrushed",
          "resolution": 1024,
          "clip": [
            "4",
            0
          ],
          "vae": [
            "5",
            0
          ],
          "images.image_1": [
            "15",
            0
          ]
        },
        "class_type": "TextEncodeQwenImage21",
        "_meta": {
          "title": "Text Encode Qwen Image 2.1"
        }
      },
      "7": {
        "inputs": {
          "width": 1024,
          "height": 1024,
          "batch_size": 1
        },
        "class_type": "EmptyLatentImage",
        "_meta": {
          "title": "Empty Latent Image"
        }
      },
      "8": {
        "inputs": {
          "add_noise": true,
          "noise_seed": 7777,
          "cfg": 3.0,
          "model": [
            "2",
            0
          ],
          "positive": [
            "6",
            0
          ],
          "negative": [
            "6",
            1
          ],
          "sampler": [
            "11",
            0
          ],
          "sigmas": [
            "12",
            0
          ],
          "latent_image": [
            "7",
            0
          ]
        },
        "class_type": "SamplerCustom",
        "_meta": {
          "title": "sampler"
        }
      },
      "9": {
        "inputs": {
          "samples": [
            "8",
            0
          ],
          "vae": [
            "5",
            0
          ]
        },
        "class_type": "VAEDecode",
        "_meta": {
          "title": "VAE Decode"
        }
      },
      "10": {
        "inputs": {
          "filename_prefix": "Qwen2.1/edit",
          "images": [
            "9",
            0
          ]
        },
        "class_type": "SaveImage",
        "_meta": {
          "title": "Save Image"
        }
      },
      "15": {
        "inputs": {
          "image": "benchmark-avatar.png"
        },
        "class_type": "LoadImage",
        "_meta": {
          "title": "Load Image"
        }
      },
      "11": {
        "inputs": {
          "sampler_name": "res_2s"
        },
        "class_type": "KSamplerSelect",
        "_meta": {
          "title": "sampler select"
        }
      },
      "12": {
        "inputs": {
          "model": [
            "2",
            0
          ],
          "scheduler": "beta57",
          "steps": 8,
          "denoise": 1.0
        },
        "class_type": "BasicScheduler",
        "_meta": {
          "title": "scheduler"
        }
      }
    }

  IMAGES_EDIT_COMFYUI_WORKFLOW_NODES: |
    [
      {
        "type": "model",
        "node_ids": [
          "1"
        ],
        "key": "unet_name"
      },
      {
        "type": "prompt",
        "node_ids": [
          "6"
        ],
        "key": "prompt"
      },
      {
        "type": "image",
        "node_ids": [
          "15"
        ],
        "key": "image"
      },
      {
        "type": "seed",
        "node_ids": [
          "8"
        ],
        "key": "noise_seed"
      }
    ]
