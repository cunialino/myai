# Open WebUI — fully declarative.
#
# ENABLE_PERSISTENT_CONFIG=false makes the `config` table inert. Verified against
# the running 0.11.0 backend:
#
#   models/config.py  get()           -> returns default_value(key), DB never read
#   models/config.py  upsert()        -> writes Config.DEFAULTS in-process only
#   config.py         seed_defaults() -> skips every key, no rows written
#   main.py:422       set_tool_servers() runs at boot, so MCP registers from env
#
# Consequence: the Admin UI still *works*, but every change is in-memory and is
# lost on the next pod restart. Git is the only durable source of truth.
#
# The 8 settings that had been hand-made in the Admin UI are reproduced below;
# the other 333 config rows already matched what env produces, so nothing else
# changes behaviour.

ollama:
  enabled: false

pipelines:
  enabled: false

websocket:
  manager: ""
  redis:
    enabled: false

# Chat models live on the Strix Halo behind llama-swap (:11434), which is now the
# single OpenAI-compatible endpoint for the whole box. The old :8731 listener is
# gone; a dead entry here is not merely cosmetic — get_all_models_responses()
# fans out over every URL in parallel and waits on all of them, so keeping it
# made each model-list refresh stall on a connect timeout. Drop it, don't disable it.
openaiBaseApiUrls:
  - http://192.168.0.6:11434/v1
openaiApiKeys:
  - no-key

extraEnvVars:
  # The switch that makes every value in this file actually take effect.
  - name: ENABLE_PERSISTENT_CONFIG
    value: "false"

  # --- previously UI-only, now declared ---
  - name: ENABLE_DIRECT_CONNECTIONS
    value: "true"
  - name: ENABLE_MEMORIES
    value: "false"
  - name: ENABLE_NOTES
    value: "false"
  - name: ENABLE_SIGNUP
    value: "false"

  # --- JSON blobs (see config-env.yaml) ---
  - name: OPENAI_API_CONFIGS
    valueFrom:
      configMapKeyRef:
        name: openwebui-env
        key: OPENAI_API_CONFIGS
  - name: TOOL_SERVER_CONNECTIONS
    valueFrom:
      configMapKeyRef:
        name: openwebui-env
        key: TOOL_SERVER_CONNECTIONS

  # --- Image generation: Qwen-Image-2.1 + viggle-turbo on ComfyUI (Strix Halo, :8188) ---
  # Engine "comfyui": Open WebUI posts the workflow from config-env.yaml to
  # /prompt, waits for completion on /ws?clientId=... and then fetches the result
  # through /view. Both the HTTP and the WebSocket side must therefore stay
  # reachable from the cluster, which plain :8188 on the LAN is (11434, the
  # llama-swap port, is the only other one open).
  #
  # The graphs use Viggle's turbo nodes (ViggleTurboLora + ViggleTurboSigmas) and a
  # 6-step er_sde schedule, so a picture is ~4x cheaper than the old 25-step KSampler
  # run. That costs two external dependencies on the ComfyUI box: Viggle's
  # comfyui/viggle_turbo.py in custom_nodes/ and the
  # Qwen-Image-2.1-viggle-turbo-v0.3-6step-lora-r256.safetensors adapter in loras/.
  # If either is missing /prompt refuses the graph and both image paths fail.
  #
  # To fall back to gufo behind llama-swap while ComfyUI is off, restore exactly:
  #   IMAGE_GENERATION_ENGINE=openai  IMAGE_EDIT_ENGINE=openai
  #   IMAGE_GENERATION_MODEL=qwen-image-2.1  IMAGE_EDIT_MODEL=qwen-image-2.1
  #   IMAGES_OPENAI_API_BASE_URL / IMAGES_EDIT_OPENAI_API_BASE_URL = http://192.168.0.6:11434/v1
  #   IMAGES_OPENAI_API_KEY / IMAGES_EDIT_OPENAI_API_KEY = no-key
  #   IMAGES_OPENAI_PARAMS='{"steps": 25}'
  - name: ENABLE_IMAGE_GENERATION
    value: "true"
  - name: IMAGE_GENERATION_ENGINE
    value: comfyui
  # Injected into the workflow's UNETLoader.unet_name (the type:model node in
  # COMFYUI_WORKFLOW_NODES), so it must be a file that exists in ComfyUI's
  # diffusion_models dir. get_image_model() returns "" when this is empty, which
  # blanks the node — it is not an optional hint. The UI dropdown is built from
  # /object_info for that same node, so the two can never disagree.
  - name: IMAGE_GENERATION_MODEL
    value: qwen_image_2.1_int8_convrot.safetensors
  - name: COMFYUI_BASE_URL
    value: http://192.168.0.6:8188
  - name: COMFYUI_WORKFLOW
    valueFrom:
      configMapKeyRef:
        name: openwebui-env
        key: COMFYUI_WORKFLOW
  - name: COMFYUI_WORKFLOW_NODES
    valueFrom:
      configMapKeyRef:
        name: openwebui-env
        key: COMFYUI_WORKFLOW_NODES
  # Written into EmptyLatentImage and, unlike the old openai path, into the graph on
  # every request: 1024x1024 is what Qwen-Image-2.1 is trained at (multiples of 32,
  # <=4096 per side). The chart default of 512x512 degrades it badly.
  - name: IMAGE_SIZE
    value: "1024x1024"
  # IMAGE_STEPS is deliberately absent. The turbo graph has no steps widget: SamplerCustom
  # walks the sigma string of ViggleTurboSigmas (node 12), so 6 steps is fixed in
  # config-env.yaml and nothing reads IMAGE_STEPS any more. Going back off the turbo is a
  # three-part change — KSampler node + "steps" mapping + IMAGE_STEPS — see the comments
  # there for why a half-revert fails (or silently does nothing).

  # --- Image EDIT: separate engine switch, its own workflow ---
  # Open WebUI uploads each attachment to ComfyUI's /upload/image, writes the returned
  # filename into the workflow's LoadImage node, then queues the graph. There is no
  # edit button in the 0.11.x UI: the chat model calls the builtin edit_image tool with
  # the URLs of the images attached to the chat (utils/tools.py).
  - name: ENABLE_IMAGE_EDIT
    value: "true"
  - name: IMAGE_EDIT_ENGINE
    value: comfyui
  # Same file as IMAGE_GENERATION_MODEL; used only when the caller omits "model",
  # which the builtin edit_image tool does.
  - name: IMAGE_EDIT_MODEL
    value: qwen_image_2.1_int8_convrot.safetensors
  - name: IMAGES_EDIT_COMFYUI_BASE_URL
    value: http://192.168.0.6:8188
  - name: IMAGES_EDIT_COMFYUI_WORKFLOW
    valueFrom:
      configMapKeyRef:
        name: openwebui-env
        key: IMAGES_EDIT_COMFYUI_WORKFLOW
  - name: IMAGES_EDIT_COMFYUI_WORKFLOW_NODES
    valueFrom:
      configMapKeyRef:
        name: openwebui-env
        key: IMAGES_EDIT_COMFYUI_WORKFLOW_NODES
  # IMAGE_EDIT_SIZE stays unset on purpose: the edit mapping carries no width/height
  # nodes (see config-env.yaml), so setting it would do nothing but mislead.

  # Cold-start headroom. Loading the ~25 GB int8 UNET plus the 8B text encoder takes
  # minutes, and the ComfyUI path holds a single /ws connection for the whole run: the
  # shared aiohttp ClientSession timeout (env.py AIOHTTP_CLIENT_TIMEOUT, 300s default)
  # bounds that socket too, so a long generation dies as "WebSocket closed
  # unexpectedly" rather than producing an image. Global knob, so it lifts every
  # outbound call, not just images.
  - name: AIOHTTP_CLIENT_TIMEOUT
    value: "900"

  # The chart derives WEBUI_URL from ingress.host, which yields the bare tailnet
  # short name "https://chat". The tailscale operator upgrades the *Ingress* to
  # chat.tail2f38ea.ts.net, but Open WebUI builds share links, OAuth redirects and
  # media URLs straight from WEBUI_URL, so those come out unreachable. Uncomment to
  # fix; unrelated to the persistent-config work.
  # - name: WEBUI_URL
  #   value: https://chat.tail2f38ea.ts.net

  # --- database ---
  - name: DATABASE_TYPE
    value: postgresql
  - name: DATABASE_HOST
    value: pg-cluster-rw.cnpg-system.svc.cluster.local
  - name: DATABASE_PORT
    value: "5432"
  - name: DATABASE_NAME
    value: openwebui
  - name: DATABASE_USER
    valueFrom:
      secretKeyRef:
        name: openwebui-db
        key: username
  - name: DATABASE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: openwebui-db
        key: password

persistence:
  enabled: true
  storageClass: longhorn-wdblack
  size: 10Gi

ingress:
  enabled: true
  class: tailscale
  annotations:
    tailscale.com/proxy-class: "tailscale-stream"
  host: chat
  tls: true
