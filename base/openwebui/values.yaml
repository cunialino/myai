# Open WebUI — fully declarative.
#
# ENABLE_PERSISTENT_CONFIG=false makes the `config` table inert. Verified against
# the running 0.11.0 backend:
#
#   models/config.py  get()           -> returns default_value(key), DB never read
#   models/config.py  upsert()        -> writes Config.DEFAULTS in-process only
#   config.py         seed_defaults() -> skips every key, no rows written
#   main.py:422       set_tool_servers() runs at boot, so MCP registers from env
#
# Consequence: the Admin UI still *works*, but every change is in-memory and is
# lost on the next pod restart. Git is the only durable source of truth.
#
# The 8 settings that had been hand-made in the Admin UI are reproduced below;
# the other 333 config rows already matched what env produces, so nothing else
# changes behaviour.

ollama:
  enabled: false

pipelines:
  enabled: false

websocket:
  manager: ""
  redis:
    enabled: false

# Chat models live on the Strix Halo behind llama-swap (:11434), which is now the
# single OpenAI-compatible endpoint for the whole box. The old :8731 listener is
# gone; a dead entry here is not merely cosmetic — get_all_models_responses()
# fans out over every URL in parallel and waits on all of them, so keeping it
# made each model-list refresh stall on a connect timeout. Drop it, don't disable it.
openaiBaseApiUrls:
  - http://192.168.0.6:11434/v1
openaiApiKeys:
  - no-key

extraEnvVars:
  # The switch that makes every value in this file actually take effect.
  - name: ENABLE_PERSISTENT_CONFIG
    value: "false"

  # --- previously UI-only, now declared ---
  - name: ENABLE_DIRECT_CONNECTIONS
    value: "true"
  - name: ENABLE_MEMORIES
    value: "false"
  - name: ENABLE_NOTES
    value: "false"
  - name: ENABLE_SIGNUP
    value: "false"

  # --- JSON blobs (see config-env.yaml) ---
  - name: OPENAI_API_CONFIGS
    valueFrom:
      configMapKeyRef:
        name: openwebui-env
        key: OPENAI_API_CONFIGS
  - name: TOOL_SERVER_CONNECTIONS
    valueFrom:
      configMapKeyRef:
        name: openwebui-env
        key: TOOL_SERVER_CONNECTIONS

  # --- Image generation: Qwen-Image-2.1 (gufo) behind llama-swap ---
  # Engine is "openai", not "comfyui": gufo serves Qwen-Image-2.1 on the standard
  # /v1/images/generations + /v1/images/edits routes and llama-swap proxies both
  # (modelPostJSONRoutes / modelPostFormRoutes in internal/server/server.go). Only
  # :11434 is reachable from the cluster, so the proxy is also the only path. The
  # ComfyUI workflow/node blobs that used to back this are deleted: ComfyUI on
  # :8188 is dead and its SD3-shaped graph (UNETLoader + CLIPLoader type:sd3 +
  # EmptySD3LatentImage) could not drive Qwen-Image anyway.
  - name: ENABLE_IMAGE_GENERATION
    value: "true"
  - name: IMAGE_GENERATION_ENGINE
    value: openai
  # Must equal gufo's --served-model-name: gufo replies 404 "requested image model
  # is not loaded" for anything else (src/cli/serve/image_api.cpp). Open WebUI sends
  # exactly this value on the generation path — get_image_model() ignores whatever
  # the UI picks, and the Settings > Images dropdown is hardcoded DALL-E/GPT-IMAGE
  # filler for the openai engine. Do not "save" it in the UI anyway: with
  # ENABLE_PERSISTENT_CONFIG=false the write is in-process and shadows this env
  # value until the pod restarts.
  - name: IMAGE_GENERATION_MODEL
    value: qwen-image-2.1
  - name: IMAGES_OPENAI_API_BASE_URL
    value: http://192.168.0.6:11434/v1
  - name: IMAGES_OPENAI_API_KEY
    value: no-key
  # Chart default is 512x512, which quietly halves Qwen-Image quality. gufo wants
  # multiples of 32, <=4096 per side, <=4 MP.
  - name: IMAGE_SIZE
    value: "1024x1024"
  # Merged verbatim into the generations JSON body. gufo rejects any parameter
  # outside {prompt, model, n, size, response_format, output_format, quality,
  # background, user, seed, steps, stream}, so only gufo keys may appear here.
  # steps defaults to 40 (range 2-100); 25 roughly halves the ~95s/image at a small
  # quality cost. Never pin seed here — every image would come out identical.
  - name: IMAGES_OPENAI_PARAMS
    value: '{"steps": 25}'

  # --- Image EDIT: same endpoint, separate engine switch ---
  # Open WebUI posts multipart to /v1/images/edits with field "image" for a single
  # upload or "image[]" for several; gufo's parser accepts both names. n / size /
  # background are omitted when unset, negative_prompt is never forwarded, and
  # response_format=b64_json is exactly what gufo requires. There is no edit button
  # in the 0.11.3 UI: the chat model calls the builtin edit_image tool with the
  # URLs of the images attached to the chat (utils/tools.py:704).
  - name: ENABLE_IMAGE_EDIT
    value: "true"
  - name: IMAGE_EDIT_ENGINE
    value: openai
  - name: IMAGE_EDIT_MODEL
    value: qwen-image-2.1
  - name: IMAGES_EDIT_OPENAI_API_BASE_URL
    value: http://192.168.0.6:11434/v1
  - name: IMAGES_EDIT_OPENAI_API_KEY
    value: no-key
  # IMAGE_EDIT_SIZE stays unset on purpose: empty makes Open WebUI omit `size`, so
  # gufo keeps the reference image's aspect ratio.

  # Cold-start headroom. The image snapshot is ~33 GB and Open WebUI's aiohttp
  # client gives up at 300s (env.py AIOHTTP_CLIENT_TIMEOUT) — that is precisely the
  # "POST /v1/images/generations 502 ... 5m0.12s" line in the llama-swap log. Global
  # knob, so it lifts every outbound call, not just images.
  - name: AIOHTTP_CLIENT_TIMEOUT
    value: "900"

  # The chart derives WEBUI_URL from ingress.host, which yields the bare tailnet
  # short name "https://chat". The tailscale operator upgrades the *Ingress* to
  # chat.tail2f38ea.ts.net, but Open WebUI builds share links, OAuth redirects and
  # media URLs straight from WEBUI_URL, so those come out unreachable. Uncomment to
  # fix; unrelated to the persistent-config work.
  # - name: WEBUI_URL
  #   value: https://chat.tail2f38ea.ts.net

  # --- database ---
  - name: DATABASE_TYPE
    value: postgresql
  - name: DATABASE_HOST
    value: pg-cluster-rw.cnpg-system.svc.cluster.local
  - name: DATABASE_PORT
    value: "5432"
  - name: DATABASE_NAME
    value: openwebui
  - name: DATABASE_USER
    valueFrom:
      secretKeyRef:
        name: openwebui-db
        key: username
  - name: DATABASE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: openwebui-db
        key: password

persistence:
  enabled: true
  storageClass: longhorn-wdblack
  size: 10Gi

ingress:
  enabled: true
  class: tailscale
  annotations:
    tailscale.com/proxy-class: "tailscale-stream"
  host: chat
  tls: true
