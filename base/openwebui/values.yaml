# Open WebUI — fully declarative.
#
# ENABLE_PERSISTENT_CONFIG=false makes the `config` table inert. Verified against
# the running 0.11.0 backend:
#
#   models/config.py  get()           -> returns default_value(key), DB never read
#   models/config.py  upsert()        -> writes Config.DEFAULTS in-process only
#   config.py         seed_defaults() -> skips every key, no rows written
#   main.py:422       set_tool_servers() runs at boot, so MCP registers from env
#
# Consequence: the Admin UI still *works*, but every change is in-memory and is
# lost on the next pod restart. Git is the only durable source of truth.
#
# The 8 settings that had been hand-made in the Admin UI are reproduced below;
# the other 333 config rows already matched what env produces, so nothing else
# changes behaviour.

ollama:
  enabled: false

pipelines:
  enabled: false

websocket:
  manager: ""
  redis:
    enabled: false

openaiBaseApiUrls:
  - http://192.168.0.6:11434/v1
openaiApiKeys:
  - no-key

extraEnvVars:
  - name: ENABLE_PERSISTENT_CONFIG
    value: "false"

  - name: ENABLE_DIRECT_CONNECTIONS
    value: "true"
  - name: ENABLE_MEMORIES
    value: "false"
  - name: ENABLE_NOTES
    value: "false"
  - name: ENABLE_SIGNUP
    value: "false"

  - name: OPENAI_API_CONFIGS
    valueFrom:
      configMapKeyRef:
        name: openwebui-env
        key: OPENAI_API_CONFIGS
  - name: TOOL_SERVER_CONNECTIONS
    valueFrom:
      configMapKeyRef:
        name: openwebui-env
        key: TOOL_SERVER_CONNECTIONS

  - name: ENABLE_IMAGE_GENERATION
    value: "true"
  - name: IMAGE_GENERATION_ENGINE
    value: comfyui
  - name: IMAGE_GENERATION_MODEL
    value: qwen_image_2.1_turbo_int8_convrot.safetensors
  - name: COMFYUI_BASE_URL
    value: http://192.168.0.6:8188
  - name: COMFYUI_WORKFLOW
    valueFrom:
      configMapKeyRef:
        name: openwebui-env
        key: COMFYUI_WORKFLOW
  - name: COMFYUI_WORKFLOW_NODES
    valueFrom:
      configMapKeyRef:
        name: openwebui-env
        key: COMFYUI_WORKFLOW_NODES
  - name: IMAGE_SIZE
    value: "1024x1024"
  - name: IMAGE_STEPS
    value: "8"

  - name: ENABLE_IMAGE_EDIT
    value: "true"
  - name: IMAGE_EDIT_ENGINE
    value: comfyui
  - name: IMAGE_EDIT_MODEL
    value: qwen_image_2.1_turbo_int8_convrot.safetensors
  - name: IMAGES_EDIT_COMFYUI_BASE_URL
    value: http://192.168.0.6:8188
  - name: IMAGES_EDIT_COMFYUI_WORKFLOW
    valueFrom:
      configMapKeyRef:
        name: openwebui-env
        key: IMAGES_EDIT_COMFYUI_WORKFLOW
  - name: IMAGES_EDIT_COMFYUI_WORKFLOW_NODES
    valueFrom:
      configMapKeyRef:
        name: openwebui-env
        key: IMAGES_EDIT_COMFYUI_WORKFLOW_NODES
  - name: AIOHTTP_CLIENT_TIMEOUT
    value: "900"

  - name: DATABASE_TYPE
    value: postgresql
  - name: DATABASE_HOST
    value: pg-cluster-rw.cnpg-system.svc.cluster.local
  - name: DATABASE_PORT
    value: "5432"
  - name: DATABASE_NAME
    value: openwebui
  - name: DATABASE_USER
    valueFrom:
      secretKeyRef:
        name: openwebui-db
        key: username
  - name: DATABASE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: openwebui-db
        key: password

persistence:
  enabled: true
  storageClass: longhorn-wdblack
  size: 10Gi

ingress:
  enabled: true
  class: tailscale
  annotations:
    tailscale.com/proxy-class: "tailscale-stream"
  host: chat
  tls: true
