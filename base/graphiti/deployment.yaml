apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: graphiti-data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-wdblack
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphiti-mcp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: graphiti-mcp
  template:
    metadata:
      labels:
        app: graphiti-mcp
    spec:
      containers:
        - name: graphiti-mcp
          image: zepai/knowledge-graph-mcp:latest
          env:
            - name: FALKORDB_URI
              value: redis://localhost:6379
            - name: FALKORDB_DATABASE
              value: memory
            - name: GRAPHITI_GROUP_ID
              value: main
            - name: SEMAPHORE_LIMIT
              value: "2"
            - name: BROWSER
              value: "1"
            - name: CONFIG_PATH
              value: /app/mcp/config/config.yaml
            - name: OPENAI_API_KEY
              value: no-key
            - name: OPENAI_BASE_URL
              value: http://llamacpp-graphiti-svc.llms.svc.cluster.local:8082/v1
            - name: LLM__MODEL
              value: qwen3-4b-2507
            - name: OPENAI_API_URL
              value: http://llamacpp-embed-svc.llms.svc.cluster.local:8081/v1
            - name: EMBEDDER__MODEL
              value: nomic-embed
            - name: EMBEDDER__DIMENSIONS
              value: "768"
            - name: GRAPHITI_TELEMETRY_ENABLED
              value: "false"
          ports:
            - containerPort: 8000
              name: http
            - containerPort: 3000
              name: browser
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: 1Gi
              cpu: 250m
            limits:
              memory: 4Gi
              cpu: 2
          volumeMounts:
            - name: data
              mountPath: /var/lib/falkordb/data
            - name: factories-patch
              mountPath: /app/mcp/src/services/factories.py
              subPath: factories.py
            - name: mcp-server-patch
              mountPath: /app/mcp/src/graphiti_mcp_server.py
              subPath: graphiti_mcp_server.py
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: graphiti-data
        - name: factories-patch
          configMap:
            name: graphiti-factories
        - name: mcp-server-patch
          configMap:
            name: graphiti-mcp-server
---
apiVersion: v1
kind: Service
metadata:
  name: graphiti-mcp
spec:
  selector:
    app: graphiti-mcp
  ports:
    - name: http
      port: 8000
      targetPort: 8000
    - name: browser
      port: 3000
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: graphiti
  annotations:
    tailscale.com/proxy-class: "tailscale-small"
spec:
  ingressClassName: tailscale
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: graphiti-mcp
                port:
                  number: 8000
  tls:
    - hosts:
        - graphiti
