apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphiti-mcp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: graphiti-mcp
  template:
    metadata:
      labels:
        app: graphiti-mcp
    spec:
      containers:
        - name: graphiti-mcp
          # Digest pin of zepai/knowledge-graph-mcp:1.1.3-standalone. The floating
          # `standalone` tag was rebuilt on 2026-10-20 against mcp SDK 2.x and
          # crash-looped the server, so this deploy tracks an immutable digest.
          image: zepai/knowledge-graph-mcp@sha256:76b835abad42b6c47aea78860014850e300b6a237c0ce3de314b1e0b174c11a2
          command:
            - /root/.local/bin/uv
            - run
            - --no-sync
            - main.py
          env:
            - name: FALKORDB_URI
              value: redis://falkordb.graphiti.svc.cluster.local:6379
            - name: FALKORDB_DATABASE
              value: main
            - name: GRAPHITI_GROUP_ID
              value: main
            - name: SEMAPHORE_LIMIT
              value: "2"
            - name: CONFIG_PATH
              value: /app/mcp/config/config.yaml
            # The image ships config.yaml with server.host 127.0.0.1, which makes the
            # pod unreachable through the LoadBalancer. Settings use __ as the nested
            # delimiter, so this overrides server.host without patching the image.
            - name: SERVER__HOST
              value: 0.0.0.0
            - name: OPENAI_API_KEY
              value: no-key
            - name: OPENAI_BASE_URL
              value: http://llamacpp-graphiti-svc-proxy.graphiti.svc.cluster.local:8080/v1
            - name: LLM__MODEL
              value: gpt-oss-20b
            - name: LLM__MAX_TOKENS
              value: "4096"
            - name: OPENAI_API_URL
              value: http://llamacpp-embed-svc-proxy.graphiti.svc.cluster.local:8080/v1
            - name: EMBEDDER__MODEL
              value: nomic-embed
            - name: EMBEDDER__DIMENSIONS
              value: "768"
            - name: GRAPHITI_TELEMETRY_ENABLED
              value: "false"
          ports:
            - containerPort: 8000
              name: http
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: 1Gi
              cpu: 250m
            limits:
              memory: 4Gi
              cpu: 2
---
apiVersion: v1
kind: Service
metadata:
  name: graphiti-mcp
  annotations:
    # Cilium LB VIP advertised on the LAN via kube-vip (same mechanism as
    # garage-svc -> 192.168.0.200). Reaches the MCP server directly over the
    # LAN without going through a Tailscale ingress.
    lbipam.cilium.io/ips: "192.168.0.201"
spec:
  selector:
    app: graphiti-mcp
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  type: LoadBalancer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: graphiti
  annotations:
    tailscale.com/proxy-class: "tailscale-small"
spec:
  ingressClassName: tailscale
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: graphiti-mcp
                port:
                  number: 8000
  tls:
    - hosts:
        - graphiti
