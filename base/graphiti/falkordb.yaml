apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: graphiti-data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-wdblack
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: falkordb
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: falkordb
  template:
    metadata:
      labels:
        app: falkordb
    spec:
      containers:
        - name: falkordb
          image: falkordb/falkordb:latest
          env:
            - name: BROWSER
              value: "0"
            - name: TLS
              value: "0"
          ports:
            - containerPort: 6379
              name: redis
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: 512Mi
              cpu: 100m
            limits:
              memory: 2Gi
              cpu: 1
          volumeMounts:
            - name: data
              mountPath: /var/lib/falkordb/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: graphiti-data
---
apiVersion: v1
kind: Service
metadata:
  name: falkordb
spec:
  selector:
    app: falkordb
  ports:
    - name: redis
      port: 6379
      targetPort: 6379