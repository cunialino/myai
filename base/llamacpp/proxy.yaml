apiVersion: v1
kind: ConfigMap
metadata:
  name: keda-interceptor-forward
  namespace: llms
data:
  default.conf: |
    server {
        listen 8080;
        client_max_body_size 0;

        location / {
            proxy_pass http://keda-add-ons-http-interceptor-proxy.keda.svc.cluster.local:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;
            proxy_request_buffering off;
            proxy_buffering off;
        }
    }
---
# Always-on forward proxy into the KEDA HTTP add-on interceptor.
# The Tailscale operator cannot resolve ExternalName backend services,
# so the ingress (and in-cluster clients) must reach the interceptor via
# a real ClusterIP Service. nginx keeps the original Host header, which
# is how the interceptor routes by InterceptorRoute host.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keda-interceptor-forward
  namespace: llms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keda-interceptor-forward
  template:
    metadata:
      labels:
        app: keda-interceptor-forward
    spec:
      containers:
        - name: nginx
          image: docker.io/nginxinc/nginx-unprivileged:1.31-alpine
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: conf
          configMap:
            name: keda-interceptor-forward
---
apiVersion: v1
kind: Service
metadata:
  name: llamacpp-svc-proxy
  namespace: llms
spec:
  type: ClusterIP
  selector:
    app: keda-interceptor-forward
  ports:
    - port: 8080
      targetPort: 8080