apiVersion: http.keda.sh/v1beta1
kind: InterceptorRoute
metadata:
  name: llamacpp
  namespace: llms
spec:
  target:
    service: llamacpp-svc
    port: 8080
  rules:
    - hosts:
        - genai
        - genai.tail2f38ea.ts.net
        - llamacpp-svc-proxy.llms
        - llamacpp-svc-proxy.llms.svc.cluster.local
  scalingMetric:
    concurrency:
      targetValue: 100
  timeouts:
    readiness: 300s
    request: 900s
    responseHeader: 300s
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: llamacpp
  namespace: llms
spec:
  scaleTargetRef:
    name: llamacpp
  minReplicaCount: 0
  maxReplicaCount: 1
  cooldownPeriod: 1200
  triggers:
    - type: external-push
      metadata:
        scalerAddress: keda-add-ons-http-external-scaler.keda:9090
        interceptorRoute: llamacpp
---
apiVersion: v1
kind: Service
metadata:
  name: llamacpp-svc-proxy
  namespace: llms
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
---
# Selectorless service -> manually point the Endpoints at the KEDA
# HTTP add-on interceptor proxy POD IPs (single NAT) so all traffic
# (in-cluster + Tailscale ingress) flows through the interceptor and
# triggers scale-to-zero. Update the IPs if the interceptor pods move.
apiVersion: v1
kind: Endpoints
metadata:
  name: llamacpp-svc-proxy
  namespace: llms
subsets:
  - addresses:
      - ip: 10.42.0.235
      - ip: 10.42.1.250
    ports:
      - port: 8080