apiVersion: apps/v1
kind: Deployment
metadata:
  name: ddg-search
  namespace: ddg-search
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ddg-search
  template:
    metadata:
      labels:
        app: ddg-search
    spec:
      containers:
        - name: ddg-search
          image: ghcr.io/tbxark/mcp-proxy:latest
          command: ["uvx"]
          args:
            - "duckduckgo-mcp-server"
            - "--transport"
            - "streamable-http"
            - "--port"
            - "8000"
            - "--host"
            - "0.0.0.0"
            - "--disable-dns-rebinding-protection"
          ports:
            - containerPort: 8000
          env:
            - name: UV_CACHE_DIR
              value: /tmp/.uv
          resources:
            limits:
              memory: "256Mi"
              cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: ddg-search
  namespace: ddg-search
  annotations:
    # Cilium LB VIP advertised on the LAN via kube-vip (same mechanism as
    # garage-svc -> 192.168.0.200). Reaches the MCP server directly over the
    # LAN without going through a Tailscale ingress.
    lbipam.cilium.io/ips: "192.168.0.202"
spec:
  selector:
    app: ddg-search
  ports:
    - port: 80
      targetPort: 8000
  type: LoadBalancer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ddg-search
  namespace: ddg-search
  annotations:
    tailscale.com/proxy-class: "tailscale-small"
spec:
  ingressClassName: tailscale
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ddg-search
                port:
                  number: 80
  tls:
    - hosts:
        - ddg
