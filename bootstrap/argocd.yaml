apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: myai
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/cunialino/myai.git'
    path: apps
    targetRevision: HEAD
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd
  syncPolicy:
    automated:
      enabled: true
      selfHeal: true
      prune: false
