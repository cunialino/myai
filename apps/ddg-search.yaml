apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ddg-search
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/cunialino/myai.git'
    path: base/ddg-search
    targetRevision: main
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: ddg-search
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      enabled: false
      selfHeal: true
      prune: false
