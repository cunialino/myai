apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: llamacpp
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/cunialino/myai.git'
    path: base/llamacpp
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: llms
  syncPolicy:
    automated:
      enabled: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
